
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Navneeta Mohapatra — AI/ML and Software Development</title>
  <desc id="desc">A burgundy technical banner with animated light and geometric details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".55" stop-color="#451126"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".8"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-.8 0" to=".8 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1020" cy="120" r="150" fill="#701A3D" opacity=".22"/>
  <circle cx="1020" cy="120" r="100" fill="none" stroke="#C77B9B" stroke-opacity=".55"/>
  <circle cx="1020" cy="120" r="66" fill="none" stroke="#E5B5C7" stroke-opacity=".3" stroke-dasharray="4 9"/>
  <path d="M870 205 Q950 20 1050 120 T1200 70" fill="none" stroke="#C77B9B" stroke-width="1.5" opacity=".7">
    <animate attributeName="stroke-dasharray" values="1 16;16 1;1 16" dur="8s" repeatCount="indefinite"/>
  </path>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#E5B5C7" font-size="13" letter-spacing="4">AI / ML  ·  SOFTWARE DEVELOPMENT</text>
    <text x="72" y="155" fill="#F8F0F3" font-size="49" font-weight="700">Navneeta</text>
    <text x="72" y="204" fill="#F8F0F3" font-size="49" font-weight="700">Mohapatra</text>
    <rect x="76" y="228" width="380" height="2" fill="url(#glow)"/>
    <text x="76" y="264" fill="#E5B5C7" font-size="16">Building practical AI and software solutions.</text>
    <text x="1120" y="285" text-anchor="end" fill="#E5B5C7" font-size="11" letter-spacing="3">BUILD · LEARN · ITERATE</text>
  </g>
</svg>
